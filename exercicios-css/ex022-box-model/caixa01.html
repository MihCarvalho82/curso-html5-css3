<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1 { /*box-level element*/
            background-color: lightblue;
            height: 300px;
            width: 300px;
            
            /*border-width: 10px;
            border-style: solid;
            border-color: blueviolet;*/
            border: 10px solid blueviolet;

            /*padding-top: 10px;
            padding-right: 10px;    
            padding-bottom: 10px;
            padding-left: 10px;*/
            padding: 10px;  /*como é o mesmo valor para todos os lados, pode usar essa forma*/

            /*para deixar um box centralizado usar margin: auto;*/

            /*margin-top: 20px;
            margin-right: 20px; 
            margin-bottom: 40px;
            margin-left: 20px;*/
            margin: 20px 20px 40px 20px;

            /*outline-width: 5px;
            outline-style: dashed;
            outline-color: green;*/
            outline: 5px dashed green;
        }
        a { /*inline-level element*/
            border-width: 10px;
            border-style: solid;
            border-color: red;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Caixa box-level</h1>
    <p>Parágrafos também são exemplos de box-level, mas os <a href="#">links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona. </p>

</body>
</html>
