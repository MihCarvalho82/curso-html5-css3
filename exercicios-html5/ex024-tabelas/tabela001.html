<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Minha Primeira Tabela</h1>
    <!-- HIERARQUIA DE TABELAS (SIMPLES)
     TABLE= Tabela
     TABLE ROW= Linha da Tabela
     TABLE HEADER= Cabeçalho da Tabela
     TABLE DATA= Dado da Tabela-->

    <table>
        <tr><!-- PRIMEIRA LINHA-->
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr> <!--Fechar TAG Td é opcional, mas FECHE!-->
        <tr class="linha"> <!-- SEGUNDA LINHA-->
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr> <!-- TERCEIRA LINHA-->
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
        <tr> <!-- QUARTA LINHA-->
            <td>A4</td>
            <td class="dado">B4</td>
            <td>C4</td>
        </tr>
    </table>
    <br>
    <h2>Minha Segunda Tabela</h2>
    <table class="tabela2">
        <tr>
            <td>A5</td>
            <td>B5</td>
            <td>C5</td>
        </tr>
        <tr>
            <td>A6</td>
            <td>B6</td>
            <td class="numero">C6</td>
        </tr>
        <tr>
            <td>A7</td>
            <td>B7</td>
            <td class="numero">C7</td>
        </tr>
        <tr>
            <td>A8</td>
            <td>B8</td>
            <td>C8</td>
    </table>
</body>

</html>
