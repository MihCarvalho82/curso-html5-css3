           Aplique um background-image no body usando a shorthand correta.

        */

        body {
            background: rgba(211, 211, 211, 0.999) url('https://via.placeholder.com/150') no-repeat fixed center;
        }

        table {
            width: 80%;
            border-collapse: collapse;

        /* DESAFIO CSS 2:
           Faça com que as linhas pares da tabela (tr) tenham uma cor de fundo 
           diferente (efeito zebra) usando pseudo-classe.
        */

tbody tr:nth-child(even) { background-color: rgb(124, 53, 53); }

            padding: 12px;
            text-align: center;
        }

</head>
