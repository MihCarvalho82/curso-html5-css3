<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
    <fieldset>
        <legend>Sexo</legend>
        <input type="radio" name="sexo" id="isxfem" value="F" checked>
        <label for="isxfem">Feminino</label><br>
        <input type="radio" name="sexo" id="isxmasc" value="M">
        <label for="isxmasc">Masculino</label>
    </fieldset>
    <fieldset>
        <legend>Esportes Favoritos</legend>
        <input type="checkbox" name="esbasq" id="iesbasq" checked>
        <label for="iesbasq">Basquete</label><br>
        <input type="checkbox" name="esnat" id="iesnat">
        <label for="iesnat">Natação</label><br>
        <input type="checkbox" name="esvolei" id="iesvolei" checked>
        <label for="iesfut">Volei</label><br>
        <input type="checkbox" name="esfut" id="iesfut">
        <label for="iesfut">Futebol</label><br>
    </fieldset>
    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>
    </form>
</body>
</html>
